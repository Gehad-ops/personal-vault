<!DOCTYPE html>
<html>
  <head>
    <title data-i18n="popupTitle"></title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../fonts/fork-awesome.min.css">
    <script src="../common/browser-polyfill.min.js"></script>
    <script src="../common/global.js"></script>
    <script src="../common/global_ui.js"></script>
    <script src="../bootstrap/bootstrap.min.js"></script>
    <script src="popup_functions.js"></script>
    <script defer src="popup.js"></script>
    <script defer src="../common/translate.js"></script>
  </head>
  <body>
    <div class="app">
      <header id="settings" class="app-header">
        <div class="brand">
          <span class="brand-mark"><i class="fa fa-key" aria-hidden="true"></i></span>
          <span class="brand-name">KeePassXC Browser</span>
        </div>
        <div class="header-actions">
          <button id="choose-custom-login-fields-button" class="icon-button" data-i18n="[title]popupChooseCredentialsText"></button>
          <button id="options-button" class="icon-button" data-i18n="[title]popupSettingsText">
            <i class="fa fa-cog" aria-hidden="true"></i>
          </button>
          <button id="lock-database-button" hidden class="icon-button danger" data-i18n="[title]lockDatabase">
            <i class="fa fa-lock" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div id="popup-alerts">
        <div id="update-available" hidden class="alert-card">
          <span data-i18n="popupUpdateAvailable"></span>
          <a target="_blank" href="https://keepassxc.org/download"><span data-i18n="popupDownloadNewVersion"></span></a>
        </div>

        <div id="getting-started-guide" hidden class="alert-card">
          <span data-i18n="popupGettingStartedText"></span>
          <a target="_blank" href="https://keepassxc.org/docs/KeePassXC_GettingStarted.html#_browser_integration"><span data-i18n="popupGettingStartedLinkText"></span></a>
          <button type="button" id="getting-started-alert-close-button" class="icon-button small" data-i18n="[title]popupAlertHide">
            <i class="fa fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <div id="troubleshooting-guide" hidden class="alert-card">
          <span data-i18n="popupTroubleshootingText"></span>
          <a target="_blank" href="https://github.com/keepassxreboot/keepassxc-browser/wiki/Troubleshooting-guide"><span data-i18n="popupTroubleshootingLinkText"></span></a>
          <button type="button" id="troubleshooting-guide-alert-close-button" class="icon-button small" data-i18n="[title]popupAlertHide">
            <i class="fa fa-times" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div id="initial-state" class="card state-card">
        <div class="loader"></div>
        <p data-i18n="popupCheckingStatus"></p>
      </div>

      <div id="not-configured" hidden class="card state-card">
        <p data-i18n="popupNotConfigured"></p>
        <button id="connect-button" class="primary-button" data-i18n="[title]connectButtonTitle">
          <i class="fa fa-link" aria-hidden="true"></i>
          <span data-i18n="popupConnectButton"></span>
        </button>
      </div>

      <div id="need-reconfigure" hidden class="card state-card">
        <p data-i18n="popupNeedReconfigure"></p>
        <code id="need-reconfigure-message"></code>
        <p class="muted" data-i18n="popupNeedReconfigureMessage"></p>
        <button id="reconnect-button" class="primary-button" data-i18n="[title]reconnectButtonTitle">
          <i class="fa fa-refresh" aria-hidden="true"></i>
          <span data-i18n="popupReconnectButton"></span>
        </button>
      </div>

      <div id="configured-not-associated" hidden class="card state-card">
        <span data-i18n="popupConfiguredNotAssociated" data-i18n-placeholder="<span class='badge' id='unassociated-identifier'></span>"></span>
      </div>

      <div id="configured-and-associated" hidden class="status-row">
        <span class="status-dot"></span>
        <span class="status-copy" data-i18n="popupConfiguredAndAssociated" data-i18n-placeholder="<span class='status-db' id='associated-identifier'></span>"></span>
        <button id="redetect-fields-button" class="icon-button" data-i18n="[title]redetectButtonTitle">
          <i class="fa fa-refresh" aria-hidden="true"></i>
        </button>
      </div>

      <div id="error-encountered" hidden class="card state-card">
        <p data-i18n="popupErrorEncountered"></p>
        <code id="error-message"></code>
        <button id="reload-status-button" class="primary-button" data-i18n="[title]reloadButtonTitle">
          <i class="fa fa-refresh" aria-hidden="true"></i>
          <span data-i18n="popupReloadButton"></span>
        </button>
      </div>

      <div id="database-not-opened" hidden class="card state-card">
        <p data-i18n="popupErrorEncountered"></p>
        <code id="database-error-message"></code>
        <button id="reopen-database-button" class="primary-button" data-i18n="[title]reopenDatabaseButtonTitle">
          <i class="fa fa-lock" aria-hidden="true"></i>
          <span data-i18n="popupReopenButton"></span>
        </button>
      </div>

      <div id="current-site-card" hidden class="card site-card">
        <div class="site-avatar" id="site-avatar">K</div>
        <div class="site-meta">
          <div class="muted" data-i18n="popupCurrentSite"></div>
          <div class="site-host" id="site-host">-</div>
        </div>
      </div>

      <div id="site-panel" hidden>
        <div class="search-bar">
          <i class="fa fa-search" aria-hidden="true"></i>
          <input type="text" id="entry-search" autocomplete="off" data-i18n="[placeholder]popupSearchPlaceholder">
          <span class="kbd">Ctrl+F</span>
        </div>

        <section id="matching-entries" class="card entries-card">
          <div class="section-head">
            <span data-i18n="popupSuggestedForSite"></span>
            <span class="count" id="entry-count">0</span>
          </div>
          <div id="login-list" class="entry-list"></div>
        </section>
      </div>

      <div id="username-field-detected" hidden class="card suggestion-card">
        <p data-i18n="popupUsernameFieldDetected"></p>
        <button id="username-only-button" class="secondary-button" data-i18n="[title]usernameButtonTitle">
          <i class="fa fa-plus" aria-hidden="true"></i>
          <span data-i18n="popupUsernameButton"></span>
        </button>
      </div>

      <div id="iframe-detected" hidden class="card suggestion-card">
        <p data-i18n="popupIframeDetected"></p>
        <button id="allow-iframe-button" class="secondary-button" data-i18n="[title]allowIframeButtonTitle">
          <i class="fa fa-plus" aria-hidden="true"></i>
          <span data-i18n="popupAllowIframeButton"></span>
        </button>
      </div>

      <button id="generate-password-button" class="action-button">
        <i class="fa fa-key" aria-hidden="true"></i>
        <span data-i18n="popupGeneratePassword"></span>
        <i class="fa fa-chevron-right action-trailing" aria-hidden="true"></i>
      </button>

      <footer class="vault-footer">
        <i class="fa fa-shield" aria-hidden="true"></i>
        <span data-i18n="popupVaultFooter"></span>
      </footer>
    </div>
  </body>
</html>
